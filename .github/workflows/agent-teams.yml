name: Agent Teams module

on:
  push:
    branches: [ 'feature/**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-teams-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Pure JVM modules (core logic and real-filesystem tests)
        run: ./gradlew :feature:agents-core:test :feature:agents-fs:test --stacktrace

      - name: Android modules compile (runtime and UI)
        run: ./gradlew :feature:agents-runtime:compileDebugKotlin :feature:agents-ui:compileDebugKotlin --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-teams-test-reports
          path: |
            feature/*/build/reports/tests
            feature/*/build/test-results
          if-no-files-found: ignore
